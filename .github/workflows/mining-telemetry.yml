name: Refresh mining telemetry

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mining-telemetry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Fetch real pool telemetry and render cards
        run: python3 scripts/update_mining.py
      - name: Commit updated telemetry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mining-telemetry.svg assets/mining-telemetry-mobile.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh mining telemetry'
          git push origin HEAD:main
